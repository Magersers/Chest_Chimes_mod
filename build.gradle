plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}
group = 'dev.chestchimes'
version = '1.0.0'
base { archivesName = 'chest-chimes' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { chestchimes { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'chestchimes' }
    }
}
mixin {
    add sourceSets.main, 'chestchimes.refmap.json'
    config 'chestchimes.mixins.json'
}
repositories { mavenCentral() }
jarJar.enable()
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'javazoom:jlayer:1.0.1'
    jarJar(group: 'javazoom', name: 'jlayer', version: '[1.0.1,1.0.2)')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'chestchimes.mixins.json')
    finalizedBy 'reobfJar'
}
tasks.named('jarJar') {
    manifest.attributes('MixinConfigs': 'chestchimes.mixins.json')
    finalizedBy 'reobfJarJar'
}
tasks.named('build') { dependsOn 'jarJar' }
