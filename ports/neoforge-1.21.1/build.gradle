plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version='1.2.0'
group='dev.chestchimes'
base { archivesName='chest-chimes-neoforge-1.21.1' }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version='21.1.252'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type='gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces','chestchimes' }
    }
    mods { chestchimes { sourceSet sourceSets.main } }
}
dependencies {
    implementation 'javazoom:jlayer:1.0.1'
    jarJar 'javazoom:jlayer:1.0.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.withType(Jar).configureEach { from('../../LICENSE'); from('../../THIRD_PARTY_NOTICES.md') }
