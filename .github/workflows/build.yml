name: Build and verify
on:
  push:
    branches-ignore: [builds]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build and unit tests
        run: ./gradlew --no-daemon build
      - name: Dedicated server integration tests
        run: ./gradlew --no-daemon runGameTestServer
      - name: Fabric 1.20.1 build and integration tests
        run: ./gradlew -p ports/fabric-1.20.1 --no-daemon build runGameTestServer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fabric 1.21.1 build and integration tests
        run: ./gradlew -p ports/fabric-1.21.1 --no-daemon build runGameTestServer
      - name: NeoForge 1.21.1 build and integration tests
        run: ./gradlew -p ports/neoforge-1.21.1 --no-daemon build runGameTestServer
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            run/logs/
            ports/*/build/reports/tests/
            ports/*/run-gametest/reports/
            ports/*/run/logs/
      - name: Check packaged mod
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          jars = list(pathlib.Path('build/libs').glob('*-all.jar'))
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as jar:
              assert 'META-INF/mods.toml' in jar.namelist()
              assert 'chestchimes.refmap.json' in jar.namelist()
              assert b'MixinConfigs: chestchimes.mixins.json' in jar.read('META-INF/MANIFEST.MF')
              metadata = json.loads(jar.read('META-INF/jarjar/metadata.json'))
              assert any(dep['identifier']['artifact'] == 'jlayer' for dep in metadata['jars'])
              for dep in metadata['jars']:
                  assert dep['path'] in jar.namelist()
          print('Packaged JAR, mappings, mixins and embedded MP3 decoder verified.')
          PY
      - name: Checkout download branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: _builds
      - name: Save verified JAR in repository
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p _builds/test-results release-files
          cp build/libs/*-all.jar release-files/
          cp ports/*/build/libs/chest-chimes-*-1.2.0.jar release-files/
          cp release-files/*.jar _builds/
          cp build/test-results/test/TEST-*.xml _builds/test-results/
          for port in fabric-1.20.1 fabric-1.21.1 neoforge-1.21.1; do
            mkdir -p "_builds/test-results/$port"
            cp ports/$port/build/test-results/test/TEST-*.xml "_builds/test-results/$port/"
          done
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile, json
          folder = pathlib.Path('_builds')
          files = sorted(pathlib.Path('release-files').glob('*.jar'))
          assert len(files) == 4, files
          for jar in files:
              with zipfile.ZipFile(jar) as archive:
                  assert 'LICENSE' in archive.namelist()
                  assert 'assets/chestchimes/logo.png' in archive.namelist()
                  if 'fabric-' in jar.name:
                      meta = json.loads(archive.read('fabric.mod.json'))
                      assert meta['jars'] and 'chestchimes.refmap.json' in archive.namelist()
                      assert all(item['file'] in archive.namelist() for item in meta['jars'])
                  elif 'neoforge-' in jar.name:
                      assert 'META-INF/neoforge.mods.toml' in archive.namelist()
                      meta = json.loads(archive.read('META-INF/jarjar/metadata.json'))
                      assert any(item['identifier']['artifact'] == 'jlayer' for item in meta['jars'])
              checksum = hashlib.sha256(jar.read_bytes()).hexdigest() + '  ' + jar.name + '\n'
              (folder / (jar.name + '.sha256')).write_text(checksum)
              (jar.parent / (jar.name + '.sha256')).write_text(checksum)
          (folder / 'README.md').write_text(
              '# Chest Chimes — verified builds\n\n' +
              '\n'.join('- [' + jar.name + '](' + jar.name + '?raw=true)' for jar in files) +
              '\n\nFabric requires Fabric API. Use matching Minecraft, loader and mod builds on both client and server.\n\n' +
              'Source: ' + os.environ['SOURCE_SHA'] + '\n\n[Build and tests](' + os.environ['BUILD_RUN'] + ')\n', encoding='utf-8')
          PY
          git -C _builds config user.name "github-actions[bot]"
          git -C _builds config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _builds add .
          git -C _builds commit -m "Build Chest Chimes from $SOURCE_SHA"
          git -C _builds push origin HEAD:builds
      - name: Publish verified release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          tag="v1.2.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" release-files/* \
            --target "$RELEASE_COMMIT" --title "Chest Chimes 1.2.0 — Fabric and NeoForge" \
            --notes-file docs/RELEASE_NOTES.md
